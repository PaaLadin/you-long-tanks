    <circle cx="593" cy="245" r="6" fill="#f0e6d2" opacity="0.4" stroke="#000" stroke-width="1.5"/>
    <circle cx="578" cy="246" r="1.3" fill="#1a0a0a"/>
    <circle cx="594" cy="246" r="1.3" fill="#1a0a0a"/>
    <path d="M615,285 L640,260 L645,270 L622,292 Z" fill="#f0e6d2" stroke="#000" stroke-width="2"/>
    <circle cx="642" cy="265" r="7" fill="#e8c8a0" stroke="#000" stroke-width="2"/>
  </g>

  <text x="100" y="200" font-size="18" font-weight="bold" fill="#f4c430" stroke="#000" stroke-width="1" font-family="Arial Black">やられない!</text>
  <text x="650" y="200" font-size="18" font-weight="bold" fill="#f4c430" stroke="#000" stroke-width="1" font-family="Arial Black">まだ戸ある!</text>
