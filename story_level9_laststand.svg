    <path d="M300,140 L360,150 L300,170 Z" fill="#c1272d" stroke="#000" stroke-width="2"/>
    <path d="M300,175 L345,185 L300,200 Z" fill="#c1272d" stroke="#000" stroke-width="2"/>
  </g>

