    <ellipse cx="740" cy="305" rx="20" ry="6" fill="#3a3a3a" stroke="#000" stroke-width="2"/>
    <!-- Флаг -->
    <path d="M200,240 L200,320" stroke="#8a5a2a" stroke-width="4"/>
