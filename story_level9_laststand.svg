    <path d="M362,250 L310,215 L300,225 L345,262 Z" fill="#f0e6d2" stroke="#000" stroke-width="2.5"/>
    <ellipse cx="308" cy="220" rx="10" ry="9" fill="#e8c8a0" stroke="#000" stroke-width="2"/>
