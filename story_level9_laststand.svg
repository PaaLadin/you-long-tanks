    <text x="400" y="284" font-size="16" font-weight="bold" fill="#f4c430" text-anchor="middle" font-family="Arial Black">最後の砲</text>
    <path d="M320,277 L280,277 M480,277 L520,277" stroke="#8a5a2a" stroke-width="3"/>
  </g>

  <!-- Студент с флагом -->
