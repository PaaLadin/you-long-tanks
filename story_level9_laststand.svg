    <path d="M375,192 Q372,175 380,166 Q377,156 387,156 Q391,146 401,153 Q407,144 416,153 Q423,150 427,163 Q435,170 432,182 Q433,196 424,200 L375,200 Z" fill="#1a0f0a" stroke="#000" stroke-width="2.5"/>
