  <circle cx="400" cy="180" r="120" fill="#c1272d" opacity="0.15"/>
  <circle cx="400" cy="180" r="80" fill="#e8c060" opacity="0.15"/>

  <!-- Баррикада на переднем плане -->
  <g id="last_barricade">
