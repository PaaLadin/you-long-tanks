    <circle cx="177" cy="245" r="6" fill="#f0e6d2" opacity="0.4" stroke="#000" stroke-width="1.5"/>
    <circle cx="193" cy="245" r="6" fill="#f0e6d2" opacity="0.4" stroke="#000" stroke-width="1.5"/>
    <circle cx="178" cy="246" r="1.3" fill="#1a0a0a"/>
