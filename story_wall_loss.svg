<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision">
  <!-- Фон: мрачное небо -->
  <defs>
    <linearGradient id="skyW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1020"/>
      <stop offset="0.6" stop-color="#3a1a1a"/>
      <stop offset="1" stop-color="#2a1a10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#skyW)"/>

  <!-- Луна с облаком -->
  <circle cx="680" cy="80" r="42" fill="#c8c0b8" opacity="0.5"/>
  <ellipse cx="700" cy="76" rx="60" ry="14" fill="#1a1020" opacity="0.7"/>

  <!-- Пагода на горизонте, тёмная -->
  <g opacity="0.6">
    <rect x="350" y="180" width="100" height="80" fill="#1a0a0a" stroke="#3a1a1a" stroke-width="2"/>
    <path d="M335,180 L465,180 L440,150 L360,150 Z" fill="#2a0a0a" stroke="#1a0a0a" stroke-width="2"/>
    <rect x="375" y="130" width="50" height="22" fill="#1a0a0a" stroke="#2a0a0a" stroke-width="2"/>
    <path d="M360,130 L440,130 L420,110 L380,110 Z" fill="#2a0a0a" stroke="#1a0a0a" stroke-width="2"/>
    <rect x="385" y="90" width="30" height="22" fill="#1a0a0a" stroke="#2a0a0a" stroke-width="2"/>
    <path d="M375,90 L425,90 L410,70 L390,70 Z" fill="#2a0a0a" stroke="#1a0a0a" stroke-width="2"/>
    <line x1="400" y1="70" x2="400" y2="58" stroke="#3a1a1a" stroke-width="2"/>
    <circle cx="400" cy="55" r="4" fill="#8a6a3a" opacity="0.7"/>
  </g>

  <!-- Небо и дым -->
  <circle cx="200" cy="100" r="18" fill="#2a1a1a" opacity="0.5"/>
  <circle cx="230" cy="90" r="14" fill="#2a1a1a" opacity="0.4"/>
  <circle cx="580" cy="130" r="20" fill="#2a1a1a" opacity="0.4"/>

  <!-- Верхняя стена (завалена баррикадами) — панорама -->
  <rect x="0" y="270" width="800" height="30" fill="#4a3a2a" stroke="#1a0a0a" stroke-width="3"/>
  <rect x="0" y="270" width="800" height="5" fill="#6a5a4a"/>

  <!-- Баррикады на стене: велосипеды, скамейки, урны, деревья, камни -->
  <!-- повторяющийся паттерн 10 объектов -->
  <g>
    <!-- 1: велосипед -->
    <circle cx="40" cy="285" r="10" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="70" cy="285" r="10" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="40" y1="285" x2="55" y2="268" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="55" y1="268" x2="70" y2="285" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="40" y1="285" x2="70" y2="285" stroke="#1a1a1a" stroke-width="2"/>
    <!-- 2: скамейка -->
    <rect x="110" y="272" width="60" height="10" fill="#8a6a4a" stroke="#000" stroke-width="2"/>
    <rect x="115" y="282" width="6" height="14" fill="#5a3a2a"/>
    <rect x="159" y="282" width="6" height="14" fill="#5a3a2a"/>
    <!-- 3: урна -->
    <rect x="200" y="264" width="22" height="28" fill="#5a5a5a" stroke="#000" stroke-width="2"/>
    <rect x="198" y="264" width="26" height="4" fill="#3a3a3a"/>
    <!-- 4: дерево -->
    <rect x="260" y="278" width="8" height="14" fill="#4a2a1a"/>
    <circle cx="264" cy="268" r="14" fill="#3a5a2a" stroke="#000" stroke-width="2"/>
    <!-- 5: камень -->
    <ellipse cx="330" cy="284" rx="14" ry="8" fill="#7a7a7a" stroke="#000" stroke-width="2"/>
    <!-- 6: знак -->
    <rect x="380" y="270" width="30" height="20" fill="#8a6a4a" stroke="#000" stroke-width="2"/>
    <text x="395" y="284" font-size="10" font-weight="bold" fill="#1a0a0a" text-anchor="middle" font-family="Arial">STOP</text>
    <!-- 7: чемодан -->
    <rect x="440" y="270" width="30" height="20" fill="#a06a3a" stroke="#000" stroke-width="2"/>
    <rect x="450" y="266" width="10" height="4" fill="#6a4a2a"/>
    <!-- 8: зонт -->
    <path d="M510,270 Q525,252 540,270 Z" fill="#c1272d" stroke="#000" stroke-width="2"/>
    <line x1="525" y1="270" x2="525" y2="284" stroke="#1a0a0a" stroke-width="2"/>
    <!-- 9: сумка -->
    <rect x="580" y="270" width="24" height="18" fill="#8a5a2a" stroke="#000" stroke-width="2"/>
    <!-- 10: колесо -->
    <circle cx="650" cy="282" r="10" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <!-- 11: скамейка -->
    <rect x="700" y="272" width="60" height="10" fill="#8a6a4a" stroke="#000" stroke-width="2"/>
    <rect x="705" y="282" width="6" height="14" fill="#5a3a2a"/>
    <rect x="749" y="282" width="6" height="14" fill="#5a3a2a"/>
  </g>

  <!-- Студенты с флагами на баррикадах -->
  <!-- Студент 1 (слева) -->
  <g>
    <rect x="150" y="215" width="22" height="55" fill="#f0e6d2" stroke="#000" stroke-width="2"/>
    <rect x="152" y="233" width="18" height="5" fill="#c1272d"/>
    <rect x="152" y="270" width="22" height="18" fill="#2a2a3a"/>
    <rect x="152" y="288" width="8" height="14" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <rect x="166" y="288" width="8" height="14" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="161" cy="203" r="12" fill="#e8c8a0" stroke="#000" stroke-width="2"/>
    <path d="M149,200 Q161,188 173,200 Q170,192 161,190 Q152,192 149,200 Z" fill="#3a2a1a" stroke="#000" stroke-width="2"/>
    <circle cx="157" cy="204" r="1.5" fill="#000"/>
    <circle cx="165" cy="204" r="1.5" fill="#000"/>
    <path d="M157,210 Q161,213 165,210" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- флаг -->
    <line x1="190" y1="180" x2="190" y2="230" stroke="#1a0a0a" stroke-width="3"/>
    <path d="M190,180 L230,190 L190,200 Z" fill="#c1272d" stroke="#000" stroke-width="2"/>
    <!-- рука -->
    <path d="M172,230 Q185,220 190,215" fill="none" stroke="#e8c8a0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Студент 2 (центр) -->
  <g>
    <rect x="390" y="210" width="24" height="60" fill="#f0e6d2" stroke="#000" stroke-width="2"/>
    <rect x="392" y="230" width="20" height="5" fill="#c1272d"/>
    <rect x="392" y="270" width="24" height="18" fill="#2a2a3a"/>
    <rect x="392" y="288" width="10" height="14" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <rect x="406" y="288" width="10" height="14" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="402" cy="196" r="13" fill="#e8c8a0" stroke="#000" stroke-width="2"/>
    <path d="M389,194 Q402,180 415,194 Q412,185 402,183 Q392,185 389,194 Z" fill="#3a2a1a" stroke="#000" stroke-width="2"/>
    <circle cx="397" cy="198" r="1.5" fill="#000"/>
    <circle cx="406" cy="198" r="1.5" fill="#000"/>
    <path d="M397,205 Q402,208 406,205" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- флаг -->
    <line x1="435" y1="170" x2="435" y2="225" stroke="#1a0a0a" stroke-width="3"/>
    <path d="M435,170 L475,180 L435,190 Z" fill="#f4c430" stroke="#000" stroke-width="2"/>
    <path d="M414,222 Q425,212 435,205" fill="none" stroke="#e8c8a0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Студент 3 (справа) -->
  <g>
    <rect x="620" y="215" width="22" height="55" fill="#f0e6d2" stroke="#000" stroke-width="2"/>
    <rect x="622" y="233" width="18" height="5" fill="#c1272d"/>
    <rect x="622" y="270" width="22" height="18" fill="#2a2a3a"/>
    <rect x="622" y="288" width="8" height="14" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <rect x="636" y="288" width="8" height="14" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
    <circle cx="631" cy="203" r="12" fill="#e8c8a0" stroke="#000" stroke-width="2"/>
    <path d="M619,200 Q631,188 643,200 Q640,192 631,190 Q622,192 619,200 Z" fill="#3a2a1a" stroke="#000" stroke-width="2"/>
    <circle cx="627" cy="204" r="1.5" fill="#000"/>
    <circle cx="635" cy="204" r="1.5" fill="#000"/>
    <path d="M627,210 Q631,213 635,210" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- флаг -->
    <line x1="660" y1="180" x2="660" y2="230" stroke="#1a0a0a" stroke-width="3"/>
    <path d="M660,180 L700,190 L660,200 Z" fill="#c1272d" stroke="#000" stroke-width="2"/>
    <path d="M640,230 Q652,220 660,215" fill="none" stroke="#e8c8a0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Земля перед стеной -->
  <rect x="0" y="300" width="800" height="100" fill="#2a1a10"/>
  <rect x="0" y="300" width="800" height="3" fill="#4a2a1a"/>

  <!-- Заголовок -->
  <rect x="0" y="0" width="800" height="34" fill="#8a1a1a"/>
  <text x="400" y="24" font-size="22" font-weight="bold" fill="#f4c430" text-anchor="middle" font-family="Arial Black, sans-serif" letter-spacing="2">城墙沦陷 · СТЕНА ПАЛА · WALL BREACHED</text>

  <!-- Нижняя надпись -->
  <text x="400" y="385" font-size="15" font-style="italic" fill="#f4c430" text-anchor="middle" font-family="Arial, sans-serif">Вся верхняя стена загорожена баррикадами. Город пал.</text>
</svg>